name: Remote VPS CD Deployment

on:
  push:
    branches:
      - main  # Triggers the runner only when pushing to your main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Executing Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/myapp
            git pull origin main
            npm install --production   # Replace with your app's dependencies
            pm2 restart myapp          # Replace with your preferred process manager/runner
